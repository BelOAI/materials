<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="py-ipynb-title py-ipynb-description">
 <title id="py-ipynb-title">Файл .py и ноутбук .ipynb</title>
 <desc id="py-ipynb-description">Файл .py выполняется целиком одной командой и выводит весь результат сразу. Ноутбук .ipynb состоит из ячеек: каждая запускается отдельно по Shift+Enter, результат появляется под ней, а переменные сохраняются между ячейками.</desc>
 <rect width="720" height="330" fill="#ffffff"/>
 <text x="170" y="28" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">script.py</text>
 <text x="540" y="28" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="bold">notebook.ipynb</text>
 <rect x="20" y="45" width="300" height="150" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
 <text x="40" y="78" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#334155" text-anchor="start" font-weight="normal">x = 2</text>
 <text x="40" y="106" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#334155" text-anchor="start" font-weight="normal">y = x * 3</text>
 <text x="40" y="134" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#334155" text-anchor="start" font-weight="normal">print(x)</text>
 <text x="40" y="162" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#334155" text-anchor="start" font-weight="normal">print(y)</text>
 <rect x="20" y="210" width="300" height="60" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
 <text x="40" y="236" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#e2e8f0" text-anchor="start" font-weight="normal">2</text>
 <text x="40" y="256" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#e2e8f0" text-anchor="start" font-weight="normal">6</text>
 <text x="170" y="300" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="normal">запуск целиком: все строки подряд</text>
 <rect x="390" y="45" width="310" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
 <text x="405" y="80" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#334155" text-anchor="start" font-weight="normal">x = 2</text>
 <text x="690" y="80" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal">Shift+Enter</text>
 <rect x="390" y="115" width="310" height="36" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
 <text x="405" y="139" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">(нет вывода, x сохранён)</text>
 <rect x="390" y="163" width="310" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
 <text x="405" y="189" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#334155" text-anchor="start" font-weight="normal">y = x * 3</text>
 <text x="405" y="211" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#334155" text-anchor="start" font-weight="normal">print(y)</text>
 <text x="690" y="189" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal">Shift+Enter</text>
 <rect x="390" y="233" width="310" height="36" rx="6" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
 <text x="405" y="257" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#e2e8f0" text-anchor="start" font-weight="normal">6</text>
 <text x="545" y="300" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="normal">по ячейкам: результат сразу под каждой</text>
</svg>
