<svg xmlns="http://www.w3.org/2000/svg" width="360" height="284" viewBox="0 0 360 284" role="img" aria-labelledby="title desc">
  <title id="title">Обучение и независимая проверка постоянного прогноза</title>
  <desc id="desc">Медиана пяти обучающих времён равна 24 минутам. Тестовые ответы открываются после выбора прогноза; средняя ошибка на них равна 5 минутам.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
  <g font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" fill="#212529">
    <rect x="12" y="8" width="336" height="64" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="180" y="32" font-weight="bold">Обучающие заказы</text>
    <text x="180" y="55">20, 22, 24, 26, 58 минут</text>
    <path d="M180 74 V101" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="12" y="108" width="336" height="52" rx="6" fill="#fff7ed" stroke="#b45309"/>
    <text x="180" y="139" font-weight="bold">Фиксируем прогноз: 24 минуты</text>
    <path d="M180 162 V189" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="12" y="196" width="336" height="80" rx="6" fill="#f0fdf4" stroke="#15803d"/>
    <text x="180" y="220" font-weight="bold">Открываем новые ответы</text>
    <text x="180" y="242">21, 25, 35 минут</text>
    <text x="180" y="264">Средняя ошибка: 5 минут</text>
  </g>
</svg>
