title: ML — Кто на огневом рубеже?
description: Классификация спортсменов по сезонной статистике с оценкой Macro-F1 и ограничением времени.
kind: programming
original: https://new.contest.yandex.ru/contests/101501/problems?id=7993389%2F2026_11_15%2F3nX6ZSXjMe
web_limits: >-
  Ограничение времени — **30 секунд**, памяти — **640 МБ**. На каждый вызов функции `predict` для одной части отводится **10 секунд и 512 МБ**, включая запуск Python и импорт библиотек. Дополнительное время на запуск оболочки и несколько вызовов не увеличивает этот лимит.
