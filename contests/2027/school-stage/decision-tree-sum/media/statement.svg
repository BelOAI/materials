<svg xmlns="http://www.w3.org/2000/svg" width="400" height="161" viewBox="0 0 400 161" role="img" aria-labelledby="title desc">
  <title id="title">Дерево решений</title>
  <desc id="desc">Сначала проверяется x &lt; 20, затем y &lt; 30. Ответы в листьях слева направо: 1, 2, −1, 3.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <style>
.cell { fill:var(--paper); stroke:var(--edge); stroke-width:1.4 }
.marked { fill:var(--blue-bg); stroke:var(--blue); stroke-width:1.5 }
.bad { fill:var(--orange-bg); stroke:var(--orange); stroke-width:1.5 }
.edge { fill:none; stroke:var(--axis); stroke-width:1.5 }
.lineblue { fill:none; stroke:var(--blue); stroke-width:2.5 }
.lineorange { fill:none; stroke:var(--orange); stroke-width:2.5 }
</style>
  <path d="M200 29L105 67M200 29L295 67M105 91L48 131M105 91L146 131M295 91L254 131M295 91L352 131" class="edge" />
  <rect x="165" y="5" width="70" height="24" rx="3" class="cell" />
  <text x="200" y="23" text-anchor="middle" class="small">x &lt; 20</text><rect x="70" y="67" width="70" height="24" rx="3" class="cell" />
  <text x="105" y="85" text-anchor="middle" class="small">y &lt; 30</text><rect x="260" y="67" width="70" height="24" rx="3" class="cell" />
  <text x="295" y="85" text-anchor="middle" class="small">y &lt; 30</text><rect x="13" y="131" width="70" height="24" rx="3" class="marked" />
  <text x="48" y="149" text-anchor="middle" class="small">+1</text><rect x="111" y="131" width="70" height="24" rx="3" class="marked" />
  <text x="146" y="149" text-anchor="middle" class="small">+2</text><rect x="219" y="131" width="70" height="24" rx="3" class="marked" />
  <text x="254" y="149" text-anchor="middle" class="small">−1</text><rect x="317" y="131" width="70" height="24" rx="3" class="marked" />
  <text x="352" y="149" text-anchor="middle" class="small">+3</text><text x="138" y="47" text-anchor="middle" class="small">да</text><text x="262" y="47" text-anchor="middle" class="small">нет</text><text x="56" y="108" text-anchor="middle" class="small">да</text><text x="149" y="108" text-anchor="middle" class="small">нет</text><text x="250" y="108" text-anchor="middle" class="small">да</text><text x="351" y="108" text-anchor="middle" class="small">нет</text></svg>
