<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="$description" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212529" media="(prefers-color-scheme: dark)" />
    <title>$title — BelOAI</title>
    <link rel="icon" href="${root}favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="${root}assets/site.css" />
    <script type="module" src="${root}assets/materials.js"></script>
  </head>
  <body data-root="$root" data-page="$page">
    <course-shell root="$root" page="$page">
    <a class="skip-link" href="#content">К содержимому</a>
    <div class="course-layout">
      <aside class="sidebar">
        <header>
          <a class="brand" href="$brand_href">BelOAI</a>
          <p class="brand-description">Подготовка к олимпиаде по искусственному интеллекту</p>
          <p class="brand-note">Открытые учебные материалы</p>
          <div class="social-icons" aria-label="Соцсети BelOAI">
            <a href="https://github.com/BelOAI" aria-label="GitHub BelOAI" title="GitHub BelOAI"><img src="${root}assets/fontawesome/github.svg" alt="" /></a>
            <a href="https://instagram.com/beloaiby" aria-label="Instagram BelOAI" title="Instagram BelOAI"><img src="${root}assets/fontawesome/instagram.svg" alt="" /></a>
            <a href="https://tiktok.com/@beloaiby" aria-label="TikTok BelOAI" title="TikTok BelOAI"><img src="${root}assets/fontawesome/tiktok.svg" alt="" /></a>
            <a href="https://t.me/beloaiby" aria-label="Telegram BelOAI" title="Telegram BelOAI"><img src="${root}assets/fontawesome/telegram.svg" alt="" /></a>
          </div>
        </header>
        <course-navigation>
        <details class="course-menu" open>
          <summary><span class="menu-label">Меню</span><span class="menu-close">Закрыть меню</span></summary>
          <nav class="$navigation_class" aria-label="$navigation_label">
            $navigation_top
            <div class="navigation-body">
            $navigation
            <hr />
            <div class="community-links">
              <strong>Сообщество</strong>
              <ul>
                <li><a href="https://github.com/BelOAI">GitHub</a></li>
                <li><a href="https://instagram.com/beloaiby">Instagram</a></li>
                <li><a href="https://tiktok.com/@beloaiby">TikTok</a></li>
                <li><a href="https://t.me/beloaiby">Telegram</a></li>
              </ul>
            </div>
            <hr />
            <p class="legal-link"><a href="${root}license/"$license_current><img src="${root}assets/fontawesome/creative-commons.svg" alt="" />Лицензия</a></p>
            </div>
          </nav>
        </details>
        </course-navigation>
      </aside>
      <div class="workspace">
        <main id="content" tabindex="-1">$content</main>
      </div>
    </div>
    <material-preview for="content"></material-preview>
    </course-shell>
  </body>
</html>
