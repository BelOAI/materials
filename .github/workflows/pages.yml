name: Publish Pages

on:
  workflow_run:
    workflows: [Presentations, Preview lifecycle]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "workflow_dispatch", "pull_request", "pull_request_target", "delete"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Assemble live environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 utils/scripts/assemble-pages.py
      - name: Mark previews in progress
        id: previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 utils/scripts/preview-deployments.py prepare
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Update PR deployments
        if: always() && steps.previews.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome }}
        run: python3 utils/scripts/preview-deployments.py finish
