name: Preview lifecycle

on:
  delete:
  pull_request_target:
    types: [closed, reopened, edited]

permissions: {}

jobs:
  reconcile:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      # No checkout and no PR code. workflow_run runs the publisher on main,
      # including when the PR targets dev (github-pages only permits main).
      - run: echo 'Reconcile preview deployments from current repository state'
