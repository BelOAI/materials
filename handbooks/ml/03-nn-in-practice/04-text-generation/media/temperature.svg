  <rect x="55" y="70" width="45" height="120" fill="var(--blue)" />
  <rect x="125" y="146" width="45" height="44" fill="var(--purple)" />
  <rect x="195" y="174" width="45" height="16" fill="var(--orange)" />
  <rect x="325" y="99" width="45" height="91" fill="var(--blue)" />
  <rect x="395" y="135" width="45" height="55" fill="var(--purple)" />
  <rect x="465" y="156" width="45" height="34" fill="var(--orange)" />
