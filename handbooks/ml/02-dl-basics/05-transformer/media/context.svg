<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Одно слово в двух контекстах</title>
  <desc id="desc">Два контекста слова «ключ». В первом оно связано с замком и дверью, во втором — с камнем и ручьём.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <text x="600" y="44" dy=".34em" text-anchor="middle" fill="var(--ink)" font-size="35" font-weight="700">Одно слово в двух контекстах</text><rect x="45" y="105" width="140" height="65" rx="14" fill="var(--blue-bg)" />
  <text x="115" y="137.5" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="27" font-weight="700">Ключ</text><rect x="221" y="105" width="355" height="65" rx="14" fill="var(--blue-bg)" />
  <text x="398.5" y="137.5" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="27" font-weight="700">не подошёл к замку</text><rect x="674" y="105" width="480" height="65" rx="14" fill="var(--blue-bg)" />
  <text x="914" y="137.5" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="27" font-weight="700">дверь осталась закрытой</text><polyline points="83,172 83,188" fill="none" stroke="var(--blue)" stroke-width="3" />
  <polyline points="83,188 914,188 914,173" fill="none" stroke="var(--blue)" stroke-width="3" />
  <polyline points="397,172 397,188" fill="none" stroke="var(--blue)" stroke-width="3" />
  <rect x="45" y="210" width="140" height="65" rx="14" fill="var(--green-bg)" />
  <text x="115" y="242.5" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="27" font-weight="700">Ключ</text><rect x="221" y="210" width="355" height="65" rx="14" fill="var(--green-bg)" />
  <text x="398.5" y="242.5" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="27" font-weight="700">забил из-под камня</text><rect x="674" y="210" width="480" height="65" rx="14" fill="var(--green-bg)" />
  <text x="914" y="242.5" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="27" font-weight="700">потёк ручей</text><polyline points="83,277 83,293" fill="none" stroke="var(--green)" stroke-width="3" />
  <polyline points="83,293 914,293 914,278" fill="none" stroke="var(--green)" stroke-width="3" />
  <polyline points="397,277 397,293" fill="none" stroke="var(--green)" stroke-width="3" />
</svg>
