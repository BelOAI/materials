<svg xmlns="http://www.w3.org/2000/svg" width="800" height="286.667" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Вес зависит от того, какое слово обрабатываем</title>
  <desc id="desc">При обработке «открыла» больший вес получает «Маша», а при обработке «ключом» — «дверь».</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <text x="600" y="44" dy=".34em" text-anchor="middle" fill="var(--ink)" font-size="35" font-weight="700">Вес зависит от того, какое слово обрабатываем</text><text x="44" y="112" dy=".34em" text-anchor="start" fill="var(--muted)" font-size="23">Обрабатываем</text><text x="603" y="112" dy=".34em" text-anchor="middle" fill="var(--muted)" font-size="23">Вес для «Маша»</text><text x="996" y="112" dy=".34em" text-anchor="middle" fill="var(--muted)" font-size="23">Вес для «дверь»</text><rect x="45" y="148" width="265" height="68" rx="14" fill="var(--blue-bg)" />
  <text x="177.5" y="182" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="27" font-weight="700">открыла</text><rect x="450" y="158" width="307" height="20" rx="8" fill="var(--grid)" />
  <rect x="450" y="158" width="245" height="20" rx="8" fill="var(--blue)" />
  <text x="450" y="202" dy=".34em" text-anchor="start" fill="var(--ink)" font-size="24" font-weight="700">80%</text><rect x="842" y="158" width="307" height="20" rx="8" fill="var(--grid)" />
  <rect x="842" y="158" width="61" height="20" rx="8" fill="var(--blue)" />
  <text x="842" y="202" dy=".34em" text-anchor="start" fill="var(--ink)" font-size="24" font-weight="700">20%</text><rect x="45" y="272" width="265" height="68" rx="14" fill="var(--blue-bg)" />
  <text x="177.5" y="306" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="27" font-weight="700">ключом</text><rect x="450" y="282" width="307" height="20" rx="8" fill="var(--grid)" />
  <rect x="450" y="282" width="46" height="20" rx="8" fill="var(--blue)" />
  <text x="450" y="326" dy=".34em" text-anchor="start" fill="var(--ink)" font-size="24" font-weight="700">15%</text><rect x="842" y="282" width="307" height="20" rx="8" fill="var(--grid)" />
  <rect x="842" y="282" width="260" height="20" rx="8" fill="var(--blue)" />
  <text x="842" y="326" dy=".34em" text-anchor="start" fill="var(--ink)" font-size="24" font-weight="700">85%</text><text x="44" y="380" dy=".34em" text-anchor="start" fill="var(--muted)" font-size="23">Условные веса для двух слов из фразы «Маша открыла дверь ключом».</text></svg>
