<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 1200 375" role="img" aria-labelledby="title desc">
  <title id="title">От фразы к наборам чисел</title>
  <desc id="desc">Фраза «У двери лежал ключ.» разбита на пять токенов. Каждому токену сопоставлен набор из двух условных чисел.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <text x="600" y="44" dy=".34em" text-anchor="middle" fill="var(--ink)" font-size="35" font-weight="700">От фразы к наборам чисел</text><text x="44" y="110" dy=".34em" text-anchor="start" fill="var(--muted)" font-size="25" font-weight="700">Текст</text><text x="44" y="201" dy=".34em" text-anchor="start" fill="var(--muted)" font-size="25" font-weight="700">Токены</text><text x="44" y="303" dy=".34em" text-anchor="start" fill="var(--muted)" font-size="25" font-weight="700">Эмбеддинги</text><rect x="300" y="83" width="844" height="56" rx="14" fill="var(--blue-bg)" />
  <text x="722" y="111" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="28" font-weight="700">У двери лежал ключ.</text><polyline points="722,146 722,171" fill="none" stroke="var(--blue)" stroke-width="4" />
  <polygon points="722.0,171.0 714.6,156.8 729.4,156.8" fill="var(--blue)" />
  <rect x="300" y="176" width="156" height="52" rx="14" fill="var(--blue-bg)" />
  <text x="378" y="202" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="25" font-weight="700">У</text><polyline points="378,232 378,267" fill="none" stroke="var(--blue)" stroke-width="4" />
  <polygon points="378.0,267.0 370.6,252.8 385.4,252.8" fill="var(--blue)" />
  <rect x="300" y="272" width="156" height="62" rx="14" fill="var(--green-bg)" />
  <text x="378" y="303" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="23" font-weight="700">[0,2; 0,5]</text><rect x="472" y="176" width="156" height="52" rx="14" fill="var(--blue-bg)" />
  <text x="550" y="202" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="25" font-weight="700">двери</text><polyline points="550,232 550,267" fill="none" stroke="var(--blue)" stroke-width="4" />
  <polygon points="550.0,267.0 542.6,252.8 557.4,252.8" fill="var(--blue)" />
  <rect x="472" y="272" width="156" height="62" rx="14" fill="var(--green-bg)" />
  <text x="550" y="303" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="23" font-weight="700">[0,8; 0,1]</text><rect x="644" y="176" width="156" height="52" rx="14" fill="var(--blue-bg)" />
  <text x="722" y="202" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="25" font-weight="700">лежал</text><polyline points="722,232 722,267" fill="none" stroke="var(--blue)" stroke-width="4" />
  <polygon points="722.0,267.0 714.6,252.8 729.4,252.8" fill="var(--blue)" />
  <rect x="644" y="272" width="156" height="62" rx="14" fill="var(--green-bg)" />
  <text x="722" y="303" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="23" font-weight="700">[0,4; 0,6]</text><rect x="816" y="176" width="156" height="52" rx="14" fill="var(--blue-bg)" />
  <text x="894" y="202" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="25" font-weight="700">ключ</text><polyline points="894,232 894,267" fill="none" stroke="var(--blue)" stroke-width="4" />
  <polygon points="894.0,267.0 886.6,252.8 901.4,252.8" fill="var(--blue)" />
  <rect x="816" y="272" width="156" height="62" rx="14" fill="var(--green-bg)" />
  <text x="894" y="303" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="23" font-weight="700">[0,7; 0,3]</text><rect x="988" y="176" width="156" height="52" rx="14" fill="var(--blue-bg)" />
  <text x="1066" y="202" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="25" font-weight="700">.</text><polyline points="1066,232 1066,267" fill="none" stroke="var(--blue)" stroke-width="4" />
  <polygon points="1066.0,267.0 1058.6,252.8 1073.4,252.8" fill="var(--blue)" />
  <rect x="988" y="272" width="156" height="62" rx="14" fill="var(--green-bg)" />
  <text x="1066" y="303" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="23" font-weight="700">[0,1; 0,9]</text></svg>
