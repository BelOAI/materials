<svg xmlns="http://www.w3.org/2000/svg" width="800" height="233.333" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Как складываются вклады</title>
  <desc id="desc">Значение 8 для «двери» умножается на 0,75, а значение 4 для «лежал» — на 0,25. Их вклады 6 и 1 складываются в 7.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <text x="600" y="44" dy=".34em" text-anchor="middle" fill="var(--ink)" font-size="35" font-weight="700">Как складываются вклады</text><rect x="45" y="105" width="185" height="64" rx="14" fill="var(--blue-bg)" />
  <text x="137.5" y="137" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="27" font-weight="700">двери</text><polyline points="244,137 281,137" fill="none" stroke="var(--blue)" stroke-width="4" />
  <polygon points="281.0,137.0 266.8,144.4 266.8,129.6" fill="var(--blue)" />
  <rect x="295" y="105" width="218" height="64" rx="14" fill="var(--blue-bg)" />
  <text x="404" y="137" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="27" font-weight="700">8 × 0,75</text><polyline points="527,137 567,137" fill="none" stroke="var(--blue)" stroke-width="4" />
  <polygon points="567.0,137.0 552.8,144.4 552.8,129.6" fill="var(--blue)" />
  <rect x="580" y="105" width="84" height="64" rx="14" fill="var(--blue-bg)" />
  <text x="622" y="137" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="27" font-weight="700">6</text><polyline points="679,137 821,192" fill="none" stroke="var(--blue)" stroke-width="4" />
  <polygon points="821.0,192.0 805.1,193.8 810.4,180.0" fill="var(--blue)" />
  <rect x="45" y="215" width="185" height="64" rx="14" fill="var(--green-bg)" />
  <text x="137.5" y="247" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="27" font-weight="700">лежал</text><polyline points="244,247 281,247" fill="none" stroke="var(--green)" stroke-width="4" />
  <polygon points="281.0,247.0 266.8,254.4 266.8,239.6" fill="var(--green)" />
  <rect x="295" y="215" width="218" height="64" rx="14" fill="var(--green-bg)" />
  <text x="404" y="247" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="27" font-weight="700">4 × 0,25</text><polyline points="527,247 567,247" fill="none" stroke="var(--green)" stroke-width="4" />
  <polygon points="567.0,247.0 552.8,254.4 552.8,239.6" fill="var(--green)" />
  <rect x="580" y="215" width="84" height="64" rx="14" fill="var(--green-bg)" />
  <text x="622" y="247" dy=".34em" text-anchor="middle" fill="var(--green)" font-size="27" font-weight="700">1</text><polyline points="679,247 821,192" fill="none" stroke="var(--green)" stroke-width="4" />
  <polygon points="821.0,192.0 810.4,204.0 805.1,190.2" fill="var(--green)" />
  <rect x="840" y="144" width="313" height="96" rx="14" fill="var(--blue-bg)" />
  <text x="996.5" y="192" dy=".34em" text-anchor="middle" fill="var(--blue)" font-size="37" font-weight="700">6 + 1 = 7</text></svg>
