  <text x="464.0" y="232.0" text-anchor="end" class="small">ракета</text>
  <rect x="470.0" y="221.0" width="2.0" height="15.0" rx="3" fill="var(--muted)" stroke="none" stroke-width="1.5" />
  <text x="477.0" y="233.0" text-anchor="start" class="muted small">0</text>
</svg>
