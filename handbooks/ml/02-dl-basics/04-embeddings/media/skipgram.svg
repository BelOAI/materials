  <text x="36.0" y="140.0" text-anchor="middle" class="bold">кот</text>
  <text x="36.0" y="175.0" text-anchor="middle" class="muted small">слово</text>
  <line x1="68.0" y1="135.0" x2="92.0" y2="135.0" stroke="var(--axis)" stroke-width="1.5" marker-end="url(#arrow-axis)" />
  <rect x="96.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <rect x="107.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <rect x="118.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <rect x="129.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <rect x="140.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <rect x="151.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <rect x="162.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <rect x="173.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <rect x="184.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <rect x="195.0" y="117.0" width="11.0" height="36.0" rx="0" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="1" />
  <text x="151.0" y="175.0" text-anchor="middle" class="muted small">вектор: 10 чисел</text>
  <line x1="210.0" y1="135.0" x2="234.0" y2="135.0" stroke="var(--axis)" stroke-width="1.5" marker-end="url(#arrow-axis)" />
  <rect x="238.0" y="101.0" width="132.0" height="68.0" rx="10" fill="none" stroke="var(--edge)" stroke-width="1.5" />
  <text x="304.0" y="131.0" text-anchor="middle" class="small bold">нейросеть</text>
  <text x="304.0" y="151.0" text-anchor="middle" class="muted small">угадывает соседа</text>
  <line x1="374.0" y1="135.0" x2="398.0" y2="135.0" stroke="var(--axis)" stroke-width="1.5" marker-end="url(#arrow-axis)" />
  <text x="510.0" y="18.0" text-anchor="middle" class="muted small">вероятность соседа</text>
  <text x="464.0" y="43.0" text-anchor="end" class="bold small">пьёт</text>
  <rect x="470.0" y="32.0" width="121.6" height="15.0" rx="3" fill="var(--green)" stroke="none" stroke-width="1.5" />
  <text x="596.6" y="44.0" text-anchor="start" class="muted small">0,2</text>
  <text x="464.0" y="70.0" text-anchor="end" class="bold small">спит</text>
  <rect x="470.0" y="59.0" width="120.1" height="15.0" rx="3" fill="var(--green)" stroke="none" stroke-width="1.5" />
  <text x="595.1" y="71.0" text-anchor="start" class="muted small">0,2</text>
  <text x="464.0" y="97.0" text-anchor="end" class="bold small">ловит</text>
  <rect x="470.0" y="86.0" width="119.8" height="15.0" rx="3" fill="var(--green)" stroke="none" stroke-width="1.5" />
  <text x="594.8" y="98.0" text-anchor="start" class="muted small">0,2</text>
  <text x="464.0" y="124.0" text-anchor="end" class="bold small">мышь</text>
  <rect x="470.0" y="113.0" width="105.1" height="15.0" rx="3" fill="var(--green)" stroke="none" stroke-width="1.5" />
