  <line x1="35.0" y1="85.0" x2="423.0" y2="85.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="35.0" y1="45.0" x2="423.0" y2="45.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="35.0" y1="245.0" x2="431.0" y2="245.0" stroke="var(--axis)" stroke-width="1.5" marker-end="url(#arrow-axis)" />
  <line x1="215.0" y1="245.0" x2="215.0" y2="21.0" stroke="var(--axis)" stroke-width="1.5" marker-end="url(#arrow-axis)" />
  <path d="M264.6 207.8 A62 62 0 0 0 252.2 195.4" fill="none" stroke="var(--green)" stroke-width="2.5" />
  <path d="M224.6 232.2 L211.8 222.6 L202.2 235.4" fill="none" stroke="var(--muted)" stroke-width="1.3" />
  <line x1="215.0" y1="245.0" x2="335.0" y2="85.0" stroke="var(--blue)" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <line x1="215.0" y1="245.0" x2="375.0" y2="125.0" stroke="var(--blue)" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <line x1="215.0" y1="245.0" x2="55.0" y2="125.0" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#arrow-muted)" />
  <line x1="335.0" y1="85.0" x2="375.0" y2="125.0" stroke="var(--orange)" stroke-width="2.5" stroke-dasharray="5 4" />
  <text x="325.0" y="81.0" text-anchor="end" class="bold blue italic">a</text>
  <text x="383.0" y="131.0" text-anchor="start" class="bold blue italic">b</text>
  <text x="55.0" y="115.0" text-anchor="middle" class="bold muted italic">c</text>
  <text x="365.0" y="97.0" text-anchor="start" class="orange small">расстояние</text>
  <text x="273.0" y="199.0" text-anchor="start" class="green small">угол</text>
  <rect x="452.0" y="16.0" width="180.0" height="72.0" rx="10" fill="var(--orange-bg)" stroke="none" stroke-width="1.5" />
  <text x="466.0" y="44.0" text-anchor="start" class="bold">расстояние a и b</text>
  <text x="466.0" y="72.0" text-anchor="start">≈ 1,41</text>
  <rect x="452.0" y="98.0" width="180.0" height="72.0" rx="10" fill="var(--green-bg)" stroke="none" stroke-width="1.5" />
  <text x="466.0" y="126.0" text-anchor="start" class="bold">cos(a, b) = 0,96</text>
  <text x="466.0" y="152.0" text-anchor="start" class="small">почти одно направление</text>
  <rect x="452.0" y="180.0" width="180.0" height="72.0" rx="10" fill="var(--blue-bg)" stroke="none" stroke-width="1.5" />
  <text x="466.0" y="208.0" text-anchor="start" class="bold">cos(a, c) = 0</text>
  <text x="466.0" y="234.0" text-anchor="start" class="small">прямой угол</text>
</svg>
