<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270" style="--figure-scale:0.75" role="img" aria-labelledby="title desc">
  <title id="title">Расстояние и угол между векторами</title>
  <desc id="desc">Векторы a = (3, 4) и b = (4, 3) почти совпадают по направлению: расстояние между концами примерно 1,41, косинус угла 0,96. Вектор c = (−4, 3) перпендикулярен a: косинус равен 0.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <style>.muted { fill:var(--muted); } .italic { font-style:italic; } .sym { font-size:calc(24px * var(--figure-scale)); }</style>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink)" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--muted)" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--blue)" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--orange)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--green)" />
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--axis)" />
    </marker>
  </defs>
  <line x1="55.0" y1="245.0" x2="55.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="95.0" y1="245.0" x2="95.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="135.0" y1="245.0" x2="135.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="175.0" y1="245.0" x2="175.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="215.0" y1="245.0" x2="215.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="255.0" y1="245.0" x2="255.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="295.0" y1="245.0" x2="295.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="335.0" y1="245.0" x2="335.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="375.0" y1="245.0" x2="375.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="415.0" y1="245.0" x2="415.0" y2="37.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="35.0" y1="245.0" x2="423.0" y2="245.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="35.0" y1="205.0" x2="423.0" y2="205.0" stroke="var(--grid)" stroke-width="1" />
  <line x1="35.0" y1="165.0" x2="423.0" y2="165.0" stroke="var(--grid)" stroke-width="1" />
