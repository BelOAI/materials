<svg xmlns="http://www.w3.org/2000/svg" width="560" height="744" viewBox="0 0 560 744" role="img" aria-labelledby="title desc">
  <title id="title">Дополнение нулями и шаг фильтра</title>
  <desc id="desc">Три случая для изображения 5 на 5 и окна 3 на 3. Без дополнения при шаге 1 карта имеет размер 3 на 3. Рамка из нулей толщиной в одну клетку даёт карту 5 на 5. Без дополнения при шаге 2 получается карта 2 на 2. На входах выделено первое положение окна.</desc>
  <style id="handbook-style">
