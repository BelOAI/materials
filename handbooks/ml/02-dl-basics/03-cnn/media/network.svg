  <title id="title">Путь изображения через свёрточную сеть</title>
  <desc id="desc">Последовательность свёрток, ReLU и пулинга; размеры данных изменяются от одного канала 28 на 28 до шестнадцати карт 7 на 7, затем до десяти выходных значений</desc>
  <style id="handbook-style">
