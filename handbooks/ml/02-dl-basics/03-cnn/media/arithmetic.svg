  <text x="454.0" y="156.0" text-anchor="middle" class="value" fill="var(--paper)">1</text><text x="280" y="135" text-anchor="middle" class="big" fill="var(--blue)">×</text><text x="280" y="233" text-anchor="middle" class="heading" fill="var(--ink)">Умножаем по клеткам</text><text x="126" y="288" text-anchor="middle" class="heading" fill="var(--blue)">Произведения</text><rect x="70" y="312" width="56" height="56" fill="var(--blue-bg)" stroke="var(--edge)" stroke-width="1" />
