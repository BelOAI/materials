  <text x="154.0" y="403.0" text-anchor="middle" class="value" fill="var(--paper)">1</text><text x="282" y="316" text-anchor="middle" class="caption" fill="var(--ink)">Складываем</text><path d="M220 368L338 368" class="flow" />
  <text x="430" y="353" text-anchor="middle" class="value" fill="var(--ink)">0 + 1 + 0 + 1</text><text x="430" y="411" text-anchor="middle" class="big" fill="var(--blue)">= 2</text></svg>
