  <title id="title">Два фильтра на одном изображении</title>
  <desc id="desc">Два ряда. В каждом изображение 4 на 4, фильтр 2 на 2 и карта 3 на 3. Фильтр А даёт строки 0,2,0, фильтр Б — нули.</desc>
