<svg xmlns="http://www.w3.org/2000/svg" width="560" height="264" viewBox="0 0 560 264" role="img" aria-labelledby="title desc">
  <title id="title">Поиск одной детали в разных частях изображения</title>
  <desc id="desc">Один уголок слева и его копия, сдвинутая на две клетки вправо. Рамки выделяют одинаковые участки 3 на 3.</desc>
