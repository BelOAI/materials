<svg xmlns="http://www.w3.org/2000/svg" width="560" height="242" viewBox="0 0 560 242" role="img" aria-labelledby="title desc">
  <title id="title">Три положения одного фильтра</title>
  <desc id="desc">Окно 2 на 2 проходит по верхней строке изображения 4 на 4. Последовательные отклики равны 0, 2 и 0.</desc>
