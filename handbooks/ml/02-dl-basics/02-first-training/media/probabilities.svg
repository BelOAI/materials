  <title id="title">Десять вероятностей для одной картинки</title>
  <desc id="desc">Слева картинка 8 на 8 с единицей, справа десять столбиков вероятностей для цифр от 0 до 9: высокий столбик 0,91 у цифры 1, небольшой 0,09 у цифры 8, остальные почти нулевые.</desc>
