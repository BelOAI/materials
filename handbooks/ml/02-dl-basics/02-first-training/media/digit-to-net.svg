<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" style="--figure-scale:0.75" role="img" aria-labelledby="title desc">
  <title id="title">От картинки к ответу сети</title>
  <desc id="desc">Картинка 8 на 8 с тройкой записана числами от 0 до 16; строки выписаны подряд в вектор из 64 чисел, который подан на входы сети из 64 входов, 16 нейронов скрытого слоя и одного выхода с вероятностью восьмёрки.</desc>
  <style id="handbook-style">
