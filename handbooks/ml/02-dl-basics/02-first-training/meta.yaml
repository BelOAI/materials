slug: first-training
title: Первое обучение нейросети
description: Обучаем небольшую сеть распознавать цифры 8 на 8 и разбираем, что происходит внутри fit.
status: draft
build: true
date: '2026-11-08'
authors:
  - name: Алексей Чернуха
topics:
  - Картинка как вектор из 64 чисел
  - Обучение MLPClassifier и доля верных ответов
  - Вероятности и уверенность ответа
  - Ошибка, производная и шаг обучения
  - Эпохи и кривая ошибки
  - Десять классов и softmax
  - Честная оценка, отправная точка и переобучение
learning_outcomes:
  - Обучать небольшую сеть на размеченных картинках и измерять её точность.
  - Объяснять, что происходит внутри fit: откуда берётся ошибка и как меняются веса.
  - Отличать результат на обучающих примерах от честной оценки на новых данных.
