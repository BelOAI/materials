  <text x="322" y="108" class="b purple">Г</text><text x="520" y="108" class="b" text-anchor="end">2,5</text><path d="M348 101h37.333" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" />
  <path d="M306 168l5 10h-10z" fill="var(--purple)" />
