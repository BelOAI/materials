  <circle cx="306" cy="317" r="4" fill="var(--blue)" />
  <text x="322" y="324" class="b blue">А</text><text x="520" y="324" class="b" text-anchor="end">7,5</text><path d="M348 317h112.000" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" />
  <text x="414" y="396" class="b purple" text-anchor="middle">Ближайший — маг</text></svg>
