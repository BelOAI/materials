<svg xmlns="http://www.w3.org/2000/svg" width="560" height="304" viewBox="0 0 560 304" role="img" aria-labelledby="title desc">
  <title id="title">Min–max нормализация: от здоровья к шкале от 0 до 1</title>
  <desc id="desc">Верхняя шкала: здоровье от 300 до 800, новый герой 650. Вычитаем минимум 300 и делим на диапазон 500. На нижней шкале минимум становится нулём, максимум — единицей, а новый герой получает 0,7.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <text x="280" y="32" class="heading" text-anchor="middle">Здоровье</text><text x="280" y="192" class="heading" text-anchor="middle">Новая шкала</text><path d="M64 88H504" class="axis" />
  <path d="M64 232H504" class="axis" />
  <path d="M64 64V248" class="grid" stroke-dasharray="4 4" />
  <path d="M496 64V248" class="grid" stroke-dasharray="4 4" />
  <path d="M64.0 81l7 13h-14z" fill="var(--purple)" />
  <path d="M64.0 225l7 13h-14z" fill="var(--purple)" />
  <text x="64.0" y="116" class="s" text-anchor="middle">300</text><text x="64.0" y="264" class="s" text-anchor="middle">0</text><path d="M150.4 81l7 13h-14z" fill="var(--purple)" />
  <path d="M150.4 225l7 13h-14z" fill="var(--purple)" />
  <text x="150.4" y="116" class="s" text-anchor="middle">400</text><text x="150.4" y="264" class="s" text-anchor="middle">0,2</text><circle cx="409.6" cy="88" r="6" fill="var(--blue)" stroke="var(--paper)" stroke-width="2" />
  <circle cx="409.6" cy="232" r="6" fill="var(--blue)" stroke="var(--paper)" stroke-width="2" />
  <text x="409.6" y="116" class="s" text-anchor="middle">700</text><text x="409.6" y="264" class="s" text-anchor="middle">0,8</text><circle cx="496.0" cy="88" r="6" fill="var(--blue)" stroke="var(--paper)" stroke-width="2" />
  <circle cx="496.0" cy="232" r="6" fill="var(--blue)" stroke="var(--paper)" stroke-width="2" />
  <text x="496.0" y="116" class="s" text-anchor="middle">800</text><text x="496.0" y="264" class="s" text-anchor="middle">1</text><text x="64" y="64" class="s m" text-anchor="middle">мин.</text><text x="496" y="64" class="s m" text-anchor="middle">макс.</text><text x="280" y="162" class="s" text-anchor="middle">Вычитаем 300, делим на 500</text><path d="M366.4 80l8 8-8 8-8-8z" fill="var(--orange)" />
  <text x="366.4" y="64" class="b orange" text-anchor="middle">650</text><path d="M366.4 224l8 8-8 8-8-8z" fill="var(--orange)" />
  <text x="366.4" y="208" class="b orange" text-anchor="middle">0,7</text></svg>
