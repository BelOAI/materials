<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" role="img" aria-labelledby="title desc">
  <title id="title">МНК, Ridge и Lasso: шпаргалка</title>
  <desc id="desc">Три карточки. МНК минимизирует сумму квадратов остатков, веса ничем не ограничены, в нашем примере w = 1,4; подходит, когда признаков мало и они разные. Ridge добавляет λ, умноженную на сумму квадратов весов, веса сжимаются, но не до нуля, при λ = 5 вес 0,7; подходит, когда признаки похожи. Lasso добавляет λ, умноженную на сумму модулей весов, лишние веса становятся нулём, при λ = 14 вес 0; подходит, когда нужно отобрать признаки. Столбики весов схематичны.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <g fill="var(--ink)">
    <text x="20" y="32" font-size="21" font-weight="bold">Три способа подобрать веса</text>
    <path d="M20 46 H720" stroke="var(--grid)" stroke-width="1.5" />
    <rect x="20" y="62" width="220" height="326" rx="10" fill="none" stroke="var(--red)" stroke-width="2" />
    <rect x="260" y="62" width="220" height="326" rx="10" fill="none" stroke="var(--blue)" stroke-width="2" />
    <rect x="500" y="62" width="220" height="326" rx="10" fill="none" stroke="var(--orange)" stroke-width="2" />
    <path d="M20 72 a10 10 0 0 1 10 -10 H230 a10 10 0 0 1 10 10 V102 H20 z" fill="var(--red)" />
    <path d="M260 72 a10 10 0 0 1 10 -10 H470 a10 10 0 0 1 10 10 V102 H260 z" fill="var(--blue)" />
    <path d="M500 72 a10 10 0 0 1 10 -10 H710 a10 10 0 0 1 10 10 V102 H500 z" fill="var(--orange)" />
    <g text-anchor="middle" font-weight="bold" font-size="18" fill="var(--paper)">
      <text x="130" y="89">МНК</text>
      <text x="370" y="89">Ridge (L₂)</text>
      <text x="610" y="89">Lasso (L₁)</text>
    </g>
    <g text-anchor="middle">
      <text x="130" y="124" font-size="11" letter-spacing="1" fill="var(--muted)">МИНИМИЗИРУЕМ</text>
      <text x="370" y="124" font-size="11" letter-spacing="1" fill="var(--muted)">МИНИМИЗИРУЕМ</text>
      <text x="610" y="124" font-size="11" letter-spacing="1" fill="var(--muted)">МИНИМИЗИРУЕМ</text>
      <text x="130" y="148" font-size="16" font-weight="bold">Σ e²</text>
      <text x="370" y="148" font-size="16" font-weight="bold">Σ e² + λ·Σ w²</text>
      <text x="610" y="148" font-size="16" font-weight="bold">Σ e² + λ·Σ |w|</text>
    </g>
    <g stroke="var(--axis)" stroke-width="1">
      <path d="M45 215 H215" />
      <path d="M285 215 H455" />
      <path d="M525 215 H695" />
    </g>
    <g fill="var(--red)">
      <rect x="55" y="171" width="20" height="44" />
      <rect x="85" y="215" width="20" height="22" />
      <rect x="115" y="189" width="20" height="26" />
      <rect x="145" y="201" width="20" height="14" />
      <rect x="175" y="215" width="20" height="12" />
    </g>
    <g fill="var(--blue)">
      <rect x="295" y="187" width="20" height="28" />
      <rect x="325" y="215" width="20" height="14" />
      <rect x="355" y="198" width="20" height="17" />
      <rect x="385" y="206" width="20" height="9" />
      <rect x="415" y="215" width="20" height="7" />
    </g>
    <g fill="var(--orange)">
      <rect x="535" y="181" width="20" height="34" />
      <rect x="565" y="215" width="20" height="16" />
      <rect x="595" y="200" width="20" height="15" />
    </g>
    <g font-size="12" fill="var(--orange)" text-anchor="middle">
      <text x="635" y="211">0</text>
      <text x="665" y="211">0</text>
    </g>
    <g font-size="11" fill="var(--muted)" text-anchor="middle">
      <text x="130" y="256">веса (схема)</text>
      <text x="370" y="256">веса (схема)</text>
      <text x="610" y="256">веса (схема)</text>
    </g>
    <g text-anchor="middle" font-size="14">
      <text x="130" y="284" font-weight="bold">веса ничем</text>
      <text x="130" y="302" font-weight="bold">не ограничены</text>
      <text x="370" y="284" font-weight="bold">сжимаются,</text>
      <text x="370" y="302" font-weight="bold">но не до нуля</text>
      <text x="610" y="284" font-weight="bold">лишние веса</text>
      <text x="610" y="302" font-weight="bold">становятся 0</text>
    </g>
    <g text-anchor="middle" font-size="13">
      <text x="130" y="330">наш пример: w = 1,4</text>
      <text x="370" y="330">λ = 5:  w = 0,7</text>
      <text x="610" y="330">λ = 14:  w = 0</text>
    </g>
    <g text-anchor="middle" font-size="12.5" fill="var(--muted)">
      <text x="130" y="356">признаков мало,</text>
      <text x="130" y="374">и они разные</text>
      <text x="370" y="356">признаки похожи,</text>
      <text x="370" y="374">нужна устойчивость</text>
      <text x="610" y="356">нужно отобрать</text>
      <text x="610" y="374">полезные признаки</text>
    </g>
  </g>
</svg>
