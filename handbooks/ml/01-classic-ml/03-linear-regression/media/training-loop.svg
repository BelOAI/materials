<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
  <title id="title">Как обучается линейная модель</title>
  <desc id="desc">Четыре шага на примере точки x = 3, y = 4. Прогноз: ŷ = 1,4 · 3 + 1,5 = 5,7. Остаток: e = 4 − 5,7 = −1,7. Потери: квадрат остатка 2,89, MSE по четырём точкам 1,05. Поправка весов: МНК находит w и b сразу формулой, градиентный спуск — маленькими шагами. Стрелка от последнего шага возвращает к прогнозу.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)" />
    </marker>
  </defs>
  <g fill="var(--ink)">
    <text x="20" y="32" font-size="21" font-weight="bold">Как обучается линейная модель</text>
    <text x="720" y="32" font-size="13" fill="var(--muted)" text-anchor="end">пример: точка x = 3, y = 4</text>
    <path d="M20 46 H720" stroke="var(--grid)" stroke-width="1.5" />
    <g text-anchor="middle">
      <rect x="20" y="64" width="160" height="150" rx="10" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="2" />
      <text x="100" y="88" font-size="12" font-weight="bold" letter-spacing="1" fill="var(--blue)">1 · ПРОГНОЗ</text>
      <text x="100" y="122" font-size="18" font-weight="bold">ŷ = w·x + b</text>
      <text x="100" y="160" font-size="13">w = 1,4;  b = 1,5</text>
      <text x="100" y="182" font-size="13">ŷ = 1,4 · 3 + 1,5</text>
      <text x="100" y="202" font-size="13" font-weight="bold">= 5,7</text>

      <rect x="200" y="64" width="160" height="150" rx="10" fill="var(--orange-bg)" stroke="var(--orange)" stroke-width="2" />
      <text x="280" y="88" font-size="12" font-weight="bold" letter-spacing="1" fill="var(--orange)">2 · ОСТАТОК</text>
      <text x="280" y="122" font-size="18" font-weight="bold">e = y − ŷ</text>
      <text x="280" y="160" font-size="13">настоящий балл 4</text>
      <text x="280" y="182" font-size="13">e = 4 − 5,7</text>
      <text x="280" y="202" font-size="13" font-weight="bold">= −1,7</text>

      <rect x="380" y="64" width="160" height="150" rx="10" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2" />
      <text x="460" y="88" font-size="12" font-weight="bold" letter-spacing="1" fill="var(--red)">3 · ПОТЕРИ</text>
      <text x="460" y="122" font-size="18" font-weight="bold">MSE</text>
      <text x="460" y="160" font-size="13">квадрат: e² = 2,89</text>
      <text x="460" y="182" font-size="13">среднее e² по</text>
      <text x="460" y="202" font-size="13" font-weight="bold">4 точкам = 1,05</text>

      <rect x="560" y="64" width="160" height="150" rx="10" fill="var(--green-bg)" stroke="var(--green)" stroke-width="2" />
      <text x="640" y="88" font-size="12" font-weight="bold" letter-spacing="1" fill="var(--green)">4 · ПОПРАВКА</text>
      <text x="640" y="122" font-size="17" font-weight="bold">меняем w и b</text>
      <text x="640" y="160" font-size="13">чтобы MSE стала</text>
      <text x="640" y="182" font-size="13">меньше:</text>
      <text x="640" y="202" font-size="13" font-weight="bold">МНК или спуск</text>
    </g>
    <g stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M181 139 H198" />
      <path d="M361 139 H378" />
      <path d="M541 139 H558" />
      <path d="M640 215 V252 H550 M190 252 H100 V217" />
    </g>
    <text x="370" y="257" font-size="13" text-anchor="middle" fill="var(--muted)">градиентный спуск повторяет круг, пока MSE падает</text>
    <text x="370" y="286" font-size="13" text-anchor="middle" fill="var(--muted)">МНК находит лучшие w и b сразу, одной формулой</text>
  </g>
</svg>
