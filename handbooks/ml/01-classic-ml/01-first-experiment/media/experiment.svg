<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">Порядок первого эксперимента</title>
  <desc id="desc">По одиннадцати известным временам обучения получаем медиану 26 минут. Времена пяти новых заказов скрыты вопросительными знаками. Сначала фиксируем прогноз 26 минут для каждого, потом открываем правильные ответы.</desc>
  <g font-family="Times New Roman, Georgia, serif" fill="#1e293b">
    <text x="24" y="32" font-size="24" font-weight="bold">Как проверяем первый прогноз</text>
    <path d="M24 48 H696" stroke="#cbd5e1" stroke-width="1.5"/>

    <text x="24" y="78" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#385f8d">ОБУЧЕНИЕ · 11 ЗАКАЗОВ</text>
    <text x="24" y="108" font-size="19">Времена уже известны</text>
    <text x="24" y="137" font-size="16">18 · 20 · 21 · 22 · 24 · 26</text>
    <text x="24" y="160" font-size="16">27 · 28 · 30 · 34 · 58 мин</text>
    <text x="24" y="195" font-size="20" font-weight="bold">Медиана = 26 мин</text>

    <path d="M351 72 V204" stroke="#d5dbe3" stroke-width="1.5"/>
    <path d="M315 189 H379" stroke="#385f8d" stroke-width="2"/>
    <path d="M379 184 L389 189 L379 194 Z" fill="#385f8d"/>

    <text x="398" y="78" font-size="14" font-weight="bold" letter-spacing="1.2" fill="#385f8d">ПРОВЕРКА · 5 НОВЫХ ЗАКАЗОВ</text>
    <text x="398" y="108" font-size="19">Время пока скрыто</text>
    <path d="M398 120 H690 M398 172 H690" stroke="#cbd5e1" stroke-width="1.2"/>
    <g font-size="15" text-anchor="middle">
      <text x="426" y="141">p12</text><text x="484" y="141">p13</text><text x="542" y="141">p14</text><text x="600" y="141">p15</text><text x="658" y="141">p16</text>
      <text x="426" y="163">?</text><text x="484" y="163">?</text><text x="542" y="163">?</text><text x="600" y="163">?</text><text x="658" y="163">?</text>
    </g>
    <text x="398" y="195" font-size="19" font-weight="bold">Прогноз: всем по 26 мин</text>

    <path d="M24 215 H696" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="239" font-size="16">Правильные ответы открываем только после выбора прогноза.</text>
  </g>
</svg>
