<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="560" height="352" viewBox="0 0 560 352" role="img">
  <title id="title">Четыре исхода ответа модели</title>
  <desc id="desc">Таблица два на два. Настоящий положительный объект, ответ «положительный» — TP, верно. Настоящий положительный, ответ «отрицательный» — FN, пропуск. Настоящий отрицательный, ответ «положительный» — FP, ложное срабатывание. Настоящий отрицательный, ответ «отрицательный» — TN, верно.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <text x="146" y="24" class="s b" text-anchor="middle">Модель: положительный</text><text x="414" y="24" class="s b" text-anchor="middle">Модель: отрицательный</text><text x="280" y="64" class="b" text-anchor="middle">На самом деле: положительный</text><rect x="24" y="80" width="244" height="104" rx="6" fill="var(--green-bg)" />
  <text x="146" y="112" class="big green" text-anchor="middle">TP</text><text x="146" y="140" class="s m" text-anchor="middle">true positive</text><text x="146" y="168" class="s" text-anchor="middle">положительный распознан</text><rect x="292" y="80" width="244" height="104" rx="6" fill="var(--red-bg)" />
  <text x="414" y="112" class="big red" text-anchor="middle">FN</text><text x="414" y="140" class="s m" text-anchor="middle">false negative</text><text x="414" y="168" class="s" text-anchor="middle">пропуск</text><text x="280" y="216" class="b" text-anchor="middle">На самом деле: отрицательный</text><rect x="24" y="232" width="244" height="104" rx="6" fill="var(--red-bg)" />
  <text x="146" y="264" class="big red" text-anchor="middle">FP</text><text x="146" y="292" class="s m" text-anchor="middle">false positive</text><text x="146" y="320" class="s" text-anchor="middle">ложное срабатывание</text><rect x="292" y="232" width="244" height="104" rx="6" fill="var(--green-bg)" />
  <text x="414" y="264" class="big green" text-anchor="middle">TN</text><text x="414" y="292" class="s m" text-anchor="middle">true negative</text><text x="414" y="320" class="s" text-anchor="middle">отрицательный распознан</text></svg>
