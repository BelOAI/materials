<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">Четыре исхода ответа модели</title>
<desc id="desc">Таблица два на два. Настоящий положительный объект, ответ «положительный» — TP, верно. Настоящий положительный, ответ «отрицательный» — FN, пропуск. Настоящий отрицательный, ответ «положительный» — FP, ложное срабатывание. Настоящий отрицательный, ответ «отрицательный» — TN, верно.</desc>
<style>
:root { color-scheme: light dark; --ink:#17243a; --muted:#64748b; --ok:#15803d; --ok-bg:#f0fdf4; --bad:#b91c1c; --bad-bg:#fef2f2; }
@media (prefers-color-scheme:dark) { :root { --ink:#e2e8f0; --muted:#aab6c4; --ok:#7fd99a; --ok-bg:#1c3326; --bad:#ff8a96; --bad-bg:#3a2227; } }
@media print { :root { --ink:#17243a; --muted:#64748b; --ok:#15803d; --ok-bg:#f0fdf4; --bad:#b91c1c; --bad-bg:#fef2f2; } }
text { font-family:'DejaVu Sans',Arial,sans-serif; font-size:14px; fill:var(--ink); } .s { font-size:12.5px; } .b { font-weight:700; } .m { fill:var(--muted); } .ok { fill:var(--ok); } .bad { fill:var(--bad); } .big { font-size:28px; font-weight:700; }
</style>
<text x="240" y="28" text-anchor="middle" class="b">Модель: положительный</text>
<text x="450" y="28" text-anchor="middle" class="b">Модель: отрицательный</text>
<text x="8" y="88" class="s m">На самом деле</text><text x="8" y="108" class="s b">положительный</text>
<text x="8" y="203" class="s m">На самом деле</text><text x="8" y="223" class="s b">отрицательный</text>
<rect x="140" y="40" width="200" height="105" rx="12" fill="var(--ok-bg)" fill-opacity=".9" stroke="var(--ok)" stroke-width="1.5"/>
<text x="240" y="77" text-anchor="middle" class="big ok">TP</text>
<text x="240" y="95" text-anchor="middle" class="s m">true positive</text>
<text x="240" y="116" text-anchor="middle" class="s">положительный распознан</text>
<text x="240" y="133" text-anchor="middle" class="s b ok">верно</text>
<rect x="350" y="40" width="200" height="105" rx="12" fill="var(--bad-bg)" fill-opacity=".9" stroke="var(--bad)" stroke-width="1.5"/>
<text x="450" y="77" text-anchor="middle" class="big bad">FN</text>
<text x="450" y="95" text-anchor="middle" class="s m">false negative</text>
<text x="450" y="116" text-anchor="middle" class="s">принят за отрицательный</text>
<text x="450" y="133" text-anchor="middle" class="s b bad">пропуск</text>
<rect x="140" y="155" width="200" height="105" rx="12" fill="var(--bad-bg)" fill-opacity=".9" stroke="var(--bad)" stroke-width="1.5"/>
<text x="240" y="192" text-anchor="middle" class="big bad">FP</text>
<text x="240" y="210" text-anchor="middle" class="s m">false positive</text>
<text x="240" y="231" text-anchor="middle" class="s">принят за положительный</text>
<text x="240" y="248" text-anchor="middle" class="s b bad">ложное срабатывание</text>
<rect x="350" y="155" width="200" height="105" rx="12" fill="var(--ok-bg)" fill-opacity=".9" stroke="var(--ok)" stroke-width="1.5"/>
<text x="450" y="192" text-anchor="middle" class="big ok">TN</text>
<text x="450" y="210" text-anchor="middle" class="s m">true negative</text>
<text x="450" y="231" text-anchor="middle" class="s">отрицательный распознан</text>
<text x="450" y="248" text-anchor="middle" class="s b ok">верно</text>
<text x="280" y="285" text-anchor="middle" class="s m">T/F — права ли модель · P/N — что она ответила</text>
</svg>
