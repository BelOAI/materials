<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-labelledby="title desc">
<title id="title">Путь от признаков письма к решению</title>
<desc id="desc">Письмо: три ссылки, незнакомый отправитель. Линейная оценка z = −2 + 1,2·3 − 1,5·0 = 1,6. Сигмоида даёт p ≈ 0,832. При пороге 0,5 письмо отправляется в спам.</desc>
<style>
:root { color-scheme: light dark; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --panel:#f3f6fa; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#17803d; --red:#c0283b; --glow:#ffffff; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --panel:#26303b; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#7fd99a; --red:#ff8a96; --glow:#000000; } }
@media print { :root { --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --panel:#f3f6fa; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#17803d; --red:#c0283b; --glow:#ffffff; } }
text { font-family:'DejaVu Sans',Arial,sans-serif; font-size:14px; fill:var(--ink); } .s { font-size:12.5px; } .b { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; font-family:'DejaVu Serif',Georgia,serif; }
.blue { fill:var(--blue); } .purple { fill:var(--purple); } .orange { fill:var(--orange); } .green { fill:var(--green); } .red { fill:var(--red); }
.panel { fill:var(--panel); fill-opacity:.85; stroke:var(--edge); }
</style>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="var(--axis)"/></marker></defs>
<rect x="8" y="30" width="124" height="110" rx="10" fill="var(--blue-bg)" fill-opacity=".9" stroke="var(--blue)" stroke-width="1.5"/>
<text x="70" y="56" text-anchor="middle" class="b blue">Признаки</text>
<text x="70" y="88" text-anchor="middle" class="s">3 ссылки, чужой</text>
<text x="70" y="116" text-anchor="middle" class="b">x₁=3, x₂=0</text>
<rect x="148" y="30" width="124" height="110" rx="10" fill="var(--purple-bg)" fill-opacity=".9" stroke="var(--purple)" stroke-width="1.5"/>
<text x="210" y="56" text-anchor="middle" class="b purple">Оценка</text>
<text x="210" y="88" text-anchor="middle" class="s">−2 + 3,6 − 0</text>
<text x="210" y="116" text-anchor="middle" class="b">z = 1,6</text>
<rect x="288" y="30" width="124" height="110" rx="10" fill="var(--purple-bg)" fill-opacity=".9" stroke="var(--purple)" stroke-width="1.5"/>
<text x="350" y="56" text-anchor="middle" class="b purple">Сигмоида</text>
<text x="350" y="88" text-anchor="middle" class="s">1 / (1 + e<tspan dy="-5" font-size="10">−1,6</tspan><tspan dy="5">)</tspan></text>
<text x="350" y="116" text-anchor="middle" class="b">p ≈ 0,832</text>
<rect x="428" y="30" width="124" height="110" rx="10" fill="var(--orange-bg)" fill-opacity=".9" stroke="var(--orange)" stroke-width="1.5"/>
<text x="490" y="56" text-anchor="middle" class="b orange">Порог 0,5</text>
<text x="490" y="88" text-anchor="middle" class="s">0,832 ≥ 0,5</text>
<text x="490" y="116" text-anchor="middle" class="b">в спам</text>
<path d="M133 85H146" stroke="var(--axis)" stroke-width="2" marker-end="url(#ar)"/>
<path d="M273 85H286" stroke="var(--axis)" stroke-width="2" marker-end="url(#ar)"/>
<path d="M413 85H426" stroke="var(--axis)" stroke-width="2" marker-end="url(#ar)"/>
<text x="280" y="18" text-anchor="middle" class="b">Одно письмо, четыре шага</text>
<text x="148" y="160" class="s m">любое число</text><text x="288" y="160" class="s m">от 0 до 1</text><text x="428" y="160" class="s m">класс 0 или 1</text>
</svg>
