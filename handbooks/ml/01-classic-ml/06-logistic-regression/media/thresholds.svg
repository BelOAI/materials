  <text x="368.0" y="420" class="s b red" text-anchor="middle">FN</text><circle cx="434.0" cy="392" r="6" fill="var(--paper)" stroke="var(--blue)" stroke-width="2" />
  <path d="M500.0 384l8 8-8 8-8-8z" fill="var(--purple)" />
  <circle cx="32" cy="472" r="6" fill="var(--paper)" stroke="var(--blue)" stroke-width="2" />
  <text x="48" y="478" class="s">обычное письмо</text><path d="M280 464l8 8-8 8-8-8z" fill="var(--purple)" />
  <text x="296" y="478" class="s">настоящий спам</text><text x="24" y="520" class="s">FP — обычное в спаме, FN — пропуск</text></svg>
