  <path d="M258.0 272l8 8-8 8-8-8z" fill="var(--purple)" />
  <text x="258.0" y="308" class="s b red" text-anchor="middle">FN</text><circle cx="302.0" cy="280" r="6" fill="var(--paper)" stroke="var(--blue)" stroke-width="2" />
