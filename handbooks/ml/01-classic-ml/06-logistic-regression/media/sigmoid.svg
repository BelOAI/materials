<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
<title id="title">Сигмоида переводит оценку в вероятность</title>
<desc id="desc">Кривая σ(z) растёт от 0 к 1. При z = −2,3 вероятность около 0,091, при z = 0 ровно 0,5, при z = 1,6 около 0,832. Отрицательные оценки дают вероятность меньше 0,5, положительные — больше.</desc>
