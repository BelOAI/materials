title: Решающие деревья
slug: decision-trees
description: Прогноз времени печати по цепочке вопросов, глубина дерева и проверка на новых заказах.
status: draft
build: true
date: "2026-10-25"
authors:
  - name: Алексей Толстиков
topics:
  - Узлы, ветви и листья решающего дерева
  - Глубина дерева, решающий пень и области решений в двух признаках
  - Переобучение и ошибка на новых заказах
learning_outcomes:
  - Читать и рисовать небольшое дерево решений для таблицы.
  - Сравнивать качество деревьев разной глубины на обучающих и новых примерах.
  - Читать цветную карту областей прогноза по высоте и числу цветов.
  - Объяснять, почему точность на обучении не гарантирует качество новых предсказаний.
