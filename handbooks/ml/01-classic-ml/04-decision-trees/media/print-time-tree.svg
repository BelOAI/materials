<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Дерево прогноза времени печати</title>
  <desc id="desc">Если высота больше 9,5 сантиметра, прогноз 58 минут. Иначе, если высота не больше 5,5 сантиметра, прогноз 21 минута; в остальных случаях 29 минут.</desc>
  <g font-family="DejaVu Sans, sans-serif" fill="#212529" text-anchor="middle">
    <rect x="225" y="12" width="230" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="340" y="42" font-size="17" font-weight="bold">Высота ≤ 9,5 см?</text>
    <path d="M275 60 L175 112 M405 60 L555 112" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="212" y="83" font-size="14">да</text>
    <text x="485" y="83" font-size="14">нет</text>
    <rect x="55" y="112" width="240" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="175" y="142" font-size="17" font-weight="bold">Высота ≤ 5,5 см?</text>
    <rect x="465" y="112" width="180" height="48" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="555" y="142" font-size="17" font-weight="bold">58 минут</text>
    <path d="M115 160 L85 222 M235 160 L265 222" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="85" y="191" font-size="14">да</text>
    <text x="266" y="191" font-size="14">нет</text>
    <rect x="10" y="222" width="150" height="48" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="85" y="252" font-size="17" font-weight="bold">21 минута</text>
    <rect x="190" y="222" width="150" height="48" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="265" y="252" font-size="17" font-weight="bold">29 минут</text>
  </g>
</svg>
