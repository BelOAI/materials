<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-labelledby="title desc">
  <title id="title">Обучение и прогноз случайного леса</title>
  <desc id="desc">Обучающие заказы А, Б, В, Г, Д дают три выборки с повторениями. Для каждого дерева признаки заново выбираются при каждом вопросе. Новый заказ поступает во все деревья, их условные ответы 24, 30 и 36 минут усредняются до 30 минут.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#43638c"/></marker>
  </defs>
  <style>
    text { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #17243a; text-anchor: middle; }
    .label { font-size: 21px; font-weight: 700; }
    .small { font-size: 19px; }
    .box { fill: #e4edf8; stroke: #43638c; stroke-width: 2; }
    .new { fill: #fff0d8; stroke: #a46718; stroke-width: 2; }
    .arrow { fill: none; stroke: #43638c; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="940" height="470" rx="16" fill="#f7f9fc"/>
  <text x="470" y="30" class="label">Обучение: каждый раз выбираем из всех пяти заказов</text>
  <rect x="220" y="45" width="500" height="42" rx="9" class="box"/>
  <text x="470" y="73" class="label">Обучающая таблица: А, Б, В, Г, Д</text>
  <path d="M340 87 L160 121 M470 87 V121 M600 87 L780 121" class="arrow"/>
  <rect x="30" y="126" width="260" height="94" rx="10" class="box"/>
  <text x="160" y="154" class="small">А, В, В, Д, А</text>
  <text x="160" y="191" class="label">Дерево 1</text>
  <rect x="340" y="126" width="260" height="94" rx="10" class="box"/>
  <text x="470" y="154" class="small">Б, Г, А, Г, Д</text>
  <text x="470" y="191" class="label">Дерево 2</text>
  <rect x="650" y="126" width="260" height="94" rx="10" class="box"/>
  <text x="780" y="154" class="small">В, Б, Д, В, Б</text>
  <text x="780" y="191" class="label">Дерево 3</text>
  <text x="470" y="248" class="small">В каждом дереве: новый набор признаков для каждого вопроса</text>
  <path d="M30 266 H910" stroke="#c4cedd" stroke-dasharray="5 5"/>
  <rect x="250" y="282" width="440" height="42" rx="9" class="new"/>
  <text x="470" y="310" class="label">Прогноз: один новый заказ</text>
  <path d="M330 324 L160 354 M470 324 V354 M610 324 L780 354" class="arrow"/>
  <text x="160" y="378" class="small">Дерево 1 → 24 мин</text>
  <text x="470" y="378" class="small">Дерево 2 → 30 мин</text>
  <text x="780" y="378" class="small">Дерево 3 → 36 мин</text>
  <path d="M160 388 L330 418 M470 388 V418 M780 388 L610 418" class="arrow"/>
  <rect x="250" y="423" width="440" height="35" rx="9" class="new"/>
  <text x="470" y="447" class="label">Средний прогноз: 30 минут</text>
</svg>
