  <title id="title">Ошибки моделей на обучающих и новых заказах</title>
  <desc id="desc">Четыре пары столбиков сравнивают среднюю абсолютную ошибку на обучении и новых заказах. Подписи над столбиками показывают вычисленные значения MAE в минутах.</desc>
