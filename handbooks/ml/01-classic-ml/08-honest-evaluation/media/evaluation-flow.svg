<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-labelledby="title desc">
  <title id="title">Три проверки и отдельная итоговая оценка</title>
  <desc id="desc">Учебные 300 заказов разделены на три фолда. По трём ошибкам выбирают настройку и обучают модель на всех 300 заказах. Отдельные 100 заказов используют один раз для итоговой оценки.</desc>
  <rect width="940" height="330" rx="16" fill="#f7f9fc"/>
  <style>
    text { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #17243a; }
    .small { font-size: 17px; }
    .label { font-size: 19px; font-weight: 700; }
    .box { fill: #e4edf8; stroke: #43638c; stroke-width: 2; }
    .hold { fill: #fff0d8; stroke: #a46718; stroke-width: 2; }
    .arrow { stroke: #43638c; stroke-width: 3; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#43638c"/></marker></defs>
  <text x="470" y="31" text-anchor="middle" class="label">300 учебных заказов: выбираем настройку</text>
  <rect x="28" y="56" width="270" height="64" rx="10" class="box"/>
  <text x="163" y="83" text-anchor="middle" class="small">Фолд 1: обучаем на 2 и 3</text>
  <text x="163" y="107" text-anchor="middle" class="small">проверяем на 1</text>
  <rect x="335" y="56" width="270" height="64" rx="10" class="box"/>
  <text x="470" y="83" text-anchor="middle" class="small">Фолд 2: обучаем на 1 и 3</text>
  <text x="470" y="107" text-anchor="middle" class="small">проверяем на 2</text>
  <rect x="642" y="56" width="270" height="64" rx="10" class="box"/>
  <text x="777" y="83" text-anchor="middle" class="small">Фолд 3: обучаем на 1 и 2</text>
  <text x="777" y="107" text-anchor="middle" class="small">проверяем на 3</text>
  <path d="M163 121 V145 H470 V160 M470 121 V160 M777 121 V145 H470" class="arrow"/>
  <rect x="330" y="164" width="280" height="51" rx="10" class="box"/>
  <text x="470" y="196" text-anchor="middle" class="label">Средняя MAE → настройка</text>
  <path d="M470 216 V236" class="arrow"/>
  <rect x="286" y="241" width="368" height="54" rx="10" class="box"/>
  <text x="470" y="275" text-anchor="middle" class="label">Обучаем на всех 300 заказах</text>
  <rect x="28" y="241" width="214" height="54" rx="10" class="hold"/>
  <text x="135" y="263" text-anchor="middle" class="small">100 новых заказов</text>
  <text x="135" y="285" text-anchor="middle" class="small">ответы пока закрыты</text>
  <path d="M656 268 H685" class="arrow"/>
  <rect x="691" y="241" width="221" height="54" rx="10" class="hold"/>
  <text x="801" y="263" text-anchor="middle" class="small">Открываем ответы</text>
  <text x="801" y="285" text-anchor="middle" class="small">итоговая MAE</text>
  <path d="M135 296 V314 H801 V299" class="arrow"/>
</svg>
