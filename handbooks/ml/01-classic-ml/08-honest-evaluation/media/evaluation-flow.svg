<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1280" height="344" viewBox="0 0 1280 344" role="img" style="--figure-scale:1.2">
  <title id="title">Три проверки и отдельная итоговая оценка</title>
  <desc id="desc">Слева сетка из трёх проверок: каждая часть учебных данных по очереди служит проверочной. Далее слева направо: выбор настройки по средней MAE, обучение на всех 300 заказах, прогноз для 100 новых и однократное открытие ответов для итоговой оценки.</desc>
  <style id="handbook-style">
:root { color-scheme:light dark; --figure-scale:1; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; }
@media (prefers-color-scheme:dark) { :root { --ink:#e3e8ee; --muted:#aab6c4; --axis:#8796a7; --grid:#3d4855; --edge:#46525f; --blue:#8cbcff; --blue-bg:#1e2c42; --purple:#c7a9ff; --purple-bg:#2d2442; --orange:#ffbd6b; --orange-bg:#3a2b1a; --green:#81c995; --green-bg:#1c3326; --red:#ff9a8a; --red-bg:#3a2227; --yellow:#fdd663; --yellow-bg:#382f18; --paper:#212529; --panel:none; } }
@media print { :root { color-scheme:light; --ink:#1b2430; --muted:#55657a; --axis:#7a8a9c; --grid:#d5dee8; --edge:#c9d4e0; --blue:#2459c2; --blue-bg:#e8f0ff; --purple:#7238c4; --purple-bg:#f2eaff; --orange:#b05300; --orange-bg:#fff2e3; --green:#188038; --green-bg:#e6f4ea; --red:#c53929; --red-bg:#fce8e6; --yellow:#8a5a00; --yellow-bg:#fef4ce; --paper:#ffffff; --panel:none; } }
svg { fill:var(--ink); font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; font-size:calc(20px * var(--figure-scale)); }
text, tspan { font-family:'PT Sans','DejaVu Sans',Arial,sans-serif; }
.s, .small { font-size:calc(16px * var(--figure-scale)); }
.heading, .label { font-size:calc(22px * var(--figure-scale)); font-weight:700; }
.b, .bold { font-weight:700; } .m { fill:var(--muted); } .i { font-style:italic; }
.big { font-size:32px; font-weight:700; }
.blue { fill:var(--blue); }
.purple { fill:var(--purple); }
.orange { fill:var(--orange); }
.green { fill:var(--green); }
.red { fill:var(--red); }
.yellow { fill:var(--yellow); }
.axis { fill:none; stroke:var(--axis); stroke-width:1.25; }
.grid { fill:none; stroke:var(--grid); stroke-width:0.75; }
.block { rx:6; stroke-width:2; }
.flow { fill:none; stroke:var(--axis); stroke-width:2; marker-end:url(#handbook-arrow); }
</style>
  <defs id="handbook-defs">
    <marker id="handbook-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="var(--axis)" />
    </marker>
  </defs>
  <text x="224" y="32" class="heading" text-anchor="middle">300 учебных заказов</text><text x="24" y="111" class="s b" text-anchor="start">Фолд 1</text><rect x="104" y="72" width="96" height="64" rx="6" fill="var(--orange-bg)" />
  <text x="152" y="99" class="b orange" text-anchor="middle">1</text><text x="152" y="124" class="s" text-anchor="middle">проверка</text><rect x="216" y="72" width="96" height="64" rx="6" fill="var(--blue-bg)" />
  <text x="264" y="99" class="b blue" text-anchor="middle">2</text><text x="264" y="124" class="s" text-anchor="middle">обучение</text><rect x="328" y="72" width="96" height="64" rx="6" fill="var(--blue-bg)" />
  <text x="376" y="99" class="b blue" text-anchor="middle">3</text><text x="376" y="124" class="s" text-anchor="middle">обучение</text><text x="24" y="199" class="s b" text-anchor="start">Фолд 2</text><rect x="104" y="160" width="96" height="64" rx="6" fill="var(--blue-bg)" />
  <text x="152" y="187" class="b blue" text-anchor="middle">1</text><text x="152" y="212" class="s" text-anchor="middle">обучение</text><rect x="216" y="160" width="96" height="64" rx="6" fill="var(--orange-bg)" />
  <text x="264" y="187" class="b orange" text-anchor="middle">2</text><text x="264" y="212" class="s" text-anchor="middle">проверка</text><rect x="328" y="160" width="96" height="64" rx="6" fill="var(--blue-bg)" />
  <text x="376" y="187" class="b blue" text-anchor="middle">3</text><text x="376" y="212" class="s" text-anchor="middle">обучение</text><text x="24" y="287" class="s b" text-anchor="start">Фолд 3</text><rect x="104" y="248" width="96" height="64" rx="6" fill="var(--blue-bg)" />
  <text x="152" y="275" class="b blue" text-anchor="middle">1</text><text x="152" y="300" class="s" text-anchor="middle">обучение</text><rect x="216" y="248" width="96" height="64" rx="6" fill="var(--blue-bg)" />
  <text x="264" y="275" class="b blue" text-anchor="middle">2</text><text x="264" y="300" class="s" text-anchor="middle">обучение</text><rect x="328" y="248" width="96" height="64" rx="6" fill="var(--orange-bg)" />
  <text x="376" y="275" class="b orange" text-anchor="middle">3</text><text x="376" y="300" class="s" text-anchor="middle">проверка</text><path d="M432 192H448" class="flow" />
  <path d="M640 192H656" class="flow" />
  <path d="M848 192H864" class="flow" />
  <path d="M1056 192H1072" class="flow" />
  <text x="544" y="168" class="heading" text-anchor="middle">Выбор</text><text x="544" y="200" class="heading" text-anchor="middle">настройки</text><text x="544" y="228" class="s" text-anchor="middle">по средней MAE</text><rect x="664" y="120" width="176" height="144" rx="6" fill="var(--blue-bg)" />
  <rect x="872" y="120" width="176" height="144" rx="6" fill="var(--orange-bg)" />
  <rect x="1080" y="120" width="176" height="144" rx="6" fill="var(--orange-bg)" />
  <text x="752" y="160" class="heading" text-anchor="middle">Обучение</text><text x="752" y="196" class="" text-anchor="middle">на всех</text><text x="752" y="228" class="" text-anchor="middle">300 заказах</text><text x="960" y="160" class="heading" text-anchor="middle">Прогноз</text><text x="960" y="196" class="" text-anchor="middle">для 100</text><text x="960" y="228" class="" text-anchor="middle">новых заказов</text><text x="960" y="304" class="s m" text-anchor="middle">Ответы закрыты</text><text x="1168" y="160" class="heading" text-anchor="middle">Открываем</text><text x="1168" y="196" class="heading" text-anchor="middle">ответы</text><text x="1168" y="236" class="s" text-anchor="middle">Итоговая MAE</text></svg>
