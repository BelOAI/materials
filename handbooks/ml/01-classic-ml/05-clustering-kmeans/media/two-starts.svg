<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-labelledby="title desc">
  <title id="title">Два устойчивых разбиения одних и тех же четырёх точек</title>
  <desc id="desc">При начальных центрах слева и справа точки A и B образуют левую группу, C и D — правую; сумма квадратов расстояний равна 4. При начальных центрах снизу и сверху A и C образуют нижнюю группу, B и D — верхнюю; сумма равна 16.</desc>
  <g font-family="Arial, sans-serif" fill="#1f2937">
    <rect x="8" y="8" width="344" height="278" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="34" font-size="16" font-weight="bold">Старт слева и справа</text>
    <text x="20" y="55" font-size="13">Центры после двух шагов: (0,1), (4,1)</text>
    <line x1="110" y1="87" x2="110" y2="232" stroke="#94a3b8"/>
    <line x1="90" y1="210" x2="294" y2="210" stroke="#94a3b8"/>
    <text x="103" y="249" font-size="12">0</text>
    <text x="264" y="249" font-size="12">4</text>
    <text x="38" y="115" font-size="12">2</text>
    <rect x="91" y="90" width="38" height="130" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="251" y="90" width="38" height="130" rx="18" fill="#ffedd5" stroke="#c2410c"/>
    <circle cx="110" cy="110" r="7" fill="#1d4ed8"/><text x="70" y="115" font-size="13">B</text>
    <circle cx="110" cy="210" r="7" fill="#1d4ed8"/><text x="70" y="215" font-size="13">A</text>
    <circle cx="270" cy="110" r="7" fill="#c2410c"/><text x="300" y="115" font-size="13">D</text>
    <circle cx="270" cy="210" r="7" fill="#c2410c"/><text x="300" y="215" font-size="13">C</text>
    <path d="M104 154 L116 166 M116 154 L104 166" stroke="#1e3a8a" stroke-width="3"/>
    <path d="M264 154 L276 166 M276 154 L264 166" stroke="#9a3412" stroke-width="3"/>
    <text x="20" y="273" font-size="13">Крестики — центры; сумма квадратов J = 4</text>

    <rect x="8" y="308" width="344" height="284" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="334" font-size="16" font-weight="bold">Старт снизу и сверху</text>
    <text x="20" y="355" font-size="13">Центры после двух шагов: (2,0), (2,2)</text>
    <line x1="110" y1="387" x2="110" y2="533" stroke="#94a3b8"/>
    <line x1="90" y1="510" x2="294" y2="510" stroke="#94a3b8"/>
    <text x="103" y="550" font-size="12">0</text>
    <text x="264" y="550" font-size="12">4</text>
    <text x="38" y="415" font-size="12">2</text>
    <rect x="91" y="391" width="198" height="38" rx="18" fill="#ffedd5" stroke="#c2410c"/>
    <rect x="91" y="491" width="198" height="38" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <circle cx="110" cy="410" r="7" fill="#c2410c"/><text x="70" y="415" font-size="13">B</text>
    <circle cx="270" cy="410" r="7" fill="#c2410c"/><text x="300" y="415" font-size="13">D</text>
    <circle cx="110" cy="510" r="7" fill="#1d4ed8"/><text x="70" y="515" font-size="13">A</text>
    <circle cx="270" cy="510" r="7" fill="#1d4ed8"/><text x="300" y="515" font-size="13">C</text>
    <path d="M184 404 L196 416 M196 404 L184 416" stroke="#9a3412" stroke-width="3"/>
    <path d="M184 504 L196 516 M196 504 L184 516" stroke="#1e3a8a" stroke-width="3"/>
    <text x="20" y="574" font-size="13">Сумма квадратов J = 16</text>
  </g>
</svg>
