title: "Кластеризация и K-means"
slug: clustering-kmeans
description: "Пять раундов K-means на двух облаках из 22 точек, выбор расстояния и кластеризация набора Iris."
status: draft
build: true
date: "2026-10-25"
authors:
  - name: Алексей Толстиков
topics:
  - Кластеризация без правильных ответов
  - Распределение по ближайшему центру
  - Пересчёт центров групп
  - Влияние начальных центров
  - Сумма квадратов расстояний
  - Классический набор «Ирисы»
learning_outcomes:
  - Прослеживать распределение и пересчёт центров до остановки на небольшом наборе точек.
  - Сравнивать число раундов при разных начальных центрах.
  - Объяснять, что измеряет сумма квадратов расстояний до центров.
  - Объяснять связь между выбранным расстоянием и способом пересчёта центра.
