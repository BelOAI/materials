title: Градиентный бустинг и табличная задача целиком
slug: gradient-boosting
description: Строим деревья по очереди, вручную проверяем первый шаг и честно сравниваем бустинг с линейной моделью и лесом.
status: draft
build: true
date: '2026-10-27'
authors:
  - name: Алексей Толстиков
topics:
  - Последовательное исправление ошибок
  - Первый шаг бустинга с квадратичной ошибкой
  - Число деревьев, глубина и скорость обучения
  - Сравнение моделей и итоговая проверка
learning_outcomes:
  - Вычислять остатки и прогноз после первого дерева бустинга.
  - Объяснять отличие последовательного бустинга от независимых деревьев леса.
  - Выбирать модель по одинаковым проверочным частям и оценивать её на отдельных данных.
