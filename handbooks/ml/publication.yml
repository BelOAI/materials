kind: Учебные материалы для подготовки к олимпиаде
status: Издательский макет
audience: Для старших школьников 15–18 лет и преподавателей.
edition: Первый издательский макет. Учебник находится в разработке.
annotation: >-
  Материалы знакомят с классическими методами машинного обучения и основами
  нейронных сетей. Объяснения сопровождаются примерами на Python, практическими
  заданиями и вопросами для самопроверки. Предназначены для самостоятельного
  изучения и подготовки к олимпиаде BelOAI.
classification:
  udk:
    value: '004.8'
    status: preliminary
    rationale: >-
      Укрупнённый раздел «Искусственный интеллект» по открытой сводке UDC Consortium.
      Уточнение до машинного обучения и определителя учебного назначения требует
      проверки по полным таблицам с учётом статуса и аудитории издания.
    sources:
      - https://udcsummary.info/php/index.php?id=13359&lang=en
  bbk:
    value: '32.813'
    status: preliminary
    rationale: >-
      Предварительный тематический раздел искусственного интеллекта по практике
      каталогизации РГБ. Индекс взят как ориентир, а не как присвоенный данной книге;
      детализация и типовое деление для школьной аудитории требуют проверки библиографом.
    sources:
      - https://search.rsl.ru/ru/record/01001269670
  author_mark:
    value: У91
    status: preliminary
    rationale: >-
      Предварительный знак по начальному слову заглавия «Учебник» для коллективного
      издания без единого автора книги. Перед выпуском требуется сверка по двузначным
      таблицам Л. Б. Хавкиной и окончательному заглавию.
    sources:
      - https://www.rsl.ru/izdatelyam/udk-bbk-predmetnye-rubriki/
      - https://search.rsl.ru/ru/record/01003348340
